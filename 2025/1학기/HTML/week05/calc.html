<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>DH's Calculator</title>

        <style>
            @media (max-width:580px)
            {
                div.empty {display: none;}
                div.vertical {display: block;}
                div.horizontal {display: none;}
            }
            @media (max-width:390px)
            {
                div.empty {display: block;}
                div.vertical {display: none;}
                div.horizontal {display: none;}
            }
            @media (min-width:581px)
            {
                div.empty {display: none;}
                div.vertical {display: none;}
                div.horizontal {display: block;}
            }
            
            #Wrapping
            {
                display: table-cell;
                background-color: rgb(245, 245, 245);
                padding: 10px;
                border: 1px solid gray;
                border-radius: 10px;
                text-align: center;
                margin: auto;
            }

            #display 
            {
                width: 100%;
                height: 60px;
                border: 1px solid gray;
                font-size: 2em;
                color: black;
                background-color: white;
                text-align: right;
                margin-bottom: 10px;
                
            }

            table 
            {
                table-layout: fixed;
                border-collapse : collapse;
                margin: 5px;
            }

            td
            {
                padding: 2px;
                text-align: center;
            }

            button 
            {
                border: 1px solid gray;
                background-color: white;
                color: black;
                text-align: center;
                font-size: 22px;
                font-weight: 600;
                border-radius: 8px;
                width : 100%;
                height: 45px;
                margin: 3px;
                cursor: pointer;
            }

            button:hover 
            {
                background-color: rgb(230, 230, 230);
            }

            button:active 
            {
                background-color: lightgray;
            }
        </style>
    </head>

    <body>
        <div class="empty">
            <p>표시할 수 없음</p>
        </div>
        
        <div class="vertical">
            <div id="Wrapping">
                <table width="360">
                    <tr>
                        <td colspan = "4">
                            <input type="text" id="display" readonly>
                            </span>
                        </td>
                    </tr>

                    <tr>
                        <td><button> </button></td>
                        <td><button></button></td>
                        <td><button></button></td>
                        <td><button></button></td>
                    </tr>

                    <tr>
                        <td><button>CE</button></td>
                        <td><button>√x</button></td>
                        <td><button>%</button></td>
                        <td><button>÷</button></td>
                    </tr>

                    <tr>
                        <td><button>7</button></td>
                        <td><button>8</button></td>
                        <td><button>9</button></td>
                        <td><button>×</button></td>
                    </tr>

                    <tr>
                        <td><button>4</button></td>
                        <td><button>5</button></td>
                        <td><button>6</button></td>
                        <td><button>−</button></td>
                    </tr>

                    <tr>
                        <td><button>1</button></td>
                        <td><button>2</button></td>
                        <td><button>3</button></td>
                        <td><button>+</button></td>
                    </tr>

                    <tr>
                        <td><button>0</button></td>
                        <td><button>.</button></td>
                        <td><button>+/−</button></td>
                        <td><button>=</button></td>
                    </tr>

                    <tr>
                        <td><button>π</button></td>
                        <td><button>x<sup>2</sup></button></td>
                        <td><button>R2</button></td>
                        <td><button>R0</button></td>
                    </tr>
                </table>

                <p style="text-align:right">
                    Powered by <b>20223156 <span style="color:#7bc8f8">DONGHYUN CHO</span></b>
                </p>
            </div>
        </div>

        <div class="horizontal">
            <div id="Wrapping">
                <table width="540">
                    <tr>
                        <td colspan = "7">
                            <input type="text" id="display" readonly>
                        </td>
                    </tr>

                    <tr>
                        <td><button></button></td>
                        <td><button></button></td>
                        <td><button>7</button></td>
                        <td><button>8</button></td>
                        <td><button>9</button></td>
                        <td><button>÷</button></td>
                        <td><button>R2</button></td>
                    </tr>

                    <tr>
                        <td><button></button></td>
                        <td><button></button></td>
                        <td><button>4</button></td>
                        <td><button>5</button></td>
                        <td><button>6</button></td>
                        <td><button>×</button></td>
                        <td><button>R0</button></td>
                    </tr>

                    <tr>
                        <td><button>π</button></td>
                        <td><button>x<sup>2</sup></button></td>
                        <td><button>1</button></td>
                        <td><button>2</button></td>
                        <td><button>3</button></td>
                        <td><button>-</button></td>
                        <td><button>CE</button></td>
                    </tr>

                    <tr>
                        <td><button>√x</button></td>
                        <td><button>÷</button></td>
                        <td><button>0</button></td>
                        <td><button>.</button></td>
                        <td><button>+/-</button></td>
                        <td><button>+</button></td>
                        <td><button>=</button></td>
                    </tr>
                </table>

                <p style="text-align:right">
                    Powered by <b>20223156 <span style="color:#7bc8f8">DONGHYUN CHO</span></b>
                </p>
            </div>
        </div>
    </body>
</html>
