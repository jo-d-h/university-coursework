    <script>
        let curValue = 0;
        let operator = '';

        function numberButton(num) 
        {
            if(document.getElementById("display1").innerHTML === "0") 
            {
                document.getElementById("display1").innerHTML = num;
            } 

            else 
            {
                document.getElementById("display1").innerHTML += num;
            }

            
            if(document.getElementById("display2").innerHTML === "0") 
            {
                document.getElementById("display2").innerHTML = num;
            } 
            else 

            {
                document.getElementById("display2").innerHTML += num;
            }
        }

        function plusButton()
        {
            curValue = parseFloat(document.getElementById("display2").innerHTML);
            document.getElementById("display1").innerHTML = 0;
            document.getElementById("display2").innerHTML = 0;
            operator = '+';
        }

        function minusButton()
        {
            curValue = parseFloat(document.getElementById("display2").innerHTML);
            document.getElementById("display1").innerHTML = 0;
            document.getElementById("display2").innerHTML = 0;
            operator = '-';
        }

        function multiplyButton() 
        {
            curValue = parseFloat(document.getElementById("display2").innerHTML);
            document.getElementById("display1").innerHTML = 0;
            document.getElementById("display2").innerHTML = 0;
            operator = '*';
        }

        function divideButton() 
        {
            curValue = parseFloat(document.getElementById("display2").innerHTML);
            document.getElementById("display1").innerHTML = 0;
            document.getElementById("display2").innerHTML = 0;
            operator = '/';
        }

        function equalButton()
        {
            if(operator == '+')
            {
                curValue += parseFloat(document.getElementById('display2').innerHTML);
                document.getElementById('display2').innerHTML = curValue;
                document.getElementById('display1').innerHTML = curValue;
            }

            else if (operator == '-')
            {
                curValue -= parseFloat(document.getElementById('display2').innerHTML);
                document.getElementById('display2').innerHTML = curValue;
                document.getElementById('display1').innerHTML = curValue;
            }

            else if (operator == '/')
            {
                curValue /= parseFloat(document.getElementById('display2').innerHTML);
                document.getElementById('display2').innerHTML = curValue;
                document.getElementById('display1').innerHTML = curValue;
            }

            else if (operator == '*')
            {
                curValue *= parseFloat(document.getElementById('display2').innerHTML);
                document.getElementById('display2').innerHTML = curValue;
                document.getElementById('display1').innerHTML = curValue;
            }
        }

        function acButton() 
        {
            curValue = 0;
            operator = '';
            document.getElementById("display1").innerHTML = 0;
            document.getElementById("display2").innerHTML = 0;
        }

        function dotButton() 
        {
            if(!document.getElementById("display1").innerHTML.includes(".")) 
            {
                document.getElementById("display1").innerHTML += ".";
            }
            if(!document.getElementById("display2").innerHTML.includes(".")) 
            {
                document.getElementById("display2").innerHTML += ".";
            }
        }

        function signChange() 
        {
            let v = -1 * parseFloat(document.getElementById("display1").innerHTML);

            document.getElementById("display1").innerHTML = v;
            document.getElementById("display2").innerHTML = v;
        }

        function piButton() 
        {
            document.getElementById("display1").innerHTML = Math.PI.toFixed(10);
            document.getElementById("display2").innerHTML = Math.PI.toFixed(10);
        }

        function squareButton() 
        {
            let v1 = parseFloat(document.getElementById("display1").innerHTML);
            let v2 = parseFloat(document.getElementById("display2").innerHTML);

            document.getElementById("display1").innerHTML = v1 * v1;
            document.getElementById("display2").innerHTML = v2 * v2;
        }

        function sqrtButton() 
        {
            let v1 = parseFloat(document.getElementById("display1").innerHTML);
            let v2 = parseFloat(document.getElementById("display2").innerHTML);

            document.getElementById("display1").innerHTML = Math.sqrt(v1);
            document.getElementById("display2").innerHTML = Math.sqrt(v2);
        }

        function percentButton() 
        {
            let v1 = parseFloat(document.getElementById("display1").innerHTML) / 100;
            let v2 = parseFloat(document.getElementById("display2").innerHTML) / 100;

            document.getElementById("display1").innerHTML = v1;
            document.getElementById("display2").innerHTML = v2;
        }

        function round0Button() 
        {
            let v1 = parseFloat(document.getElementById("display1").innerHTML);
            let v2 = parseFloat(document.getElementById("display2").innerHTML);

            document.getElementById("display1").innerHTML = Math.round(v1);
            document.getElementById("display2").innerHTML = Math.round(v2);
        }

        function round2Button() 
        {
            let v1 = parseFloat(document.getElementById("display1").innerHTML);
            let v2 = parseFloat(document.getElementById("display2").innerHTML);

            document.getElementById("display1").innerHTML = v1.toFixed(2);
            document.getElementById("display2").innerHTML = v2.toFixed(2);
        }
